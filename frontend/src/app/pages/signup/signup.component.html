<div class="auth-container">
  <div class="auth-card">
    <div class="logo">
      <span class="logo-mark"></span>
      <span class="logo-text">prelegal</span>
    </div>

    <h1>Create your account</h1>
    <p class="subtitle">Draft legal agreements in minutes with AI assistance</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="you@company.com"
          autocomplete="email"
        />
      </div>

      <div class="field">
        <label for="password">Password <span class="hint">min. 8 characters</span></label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="new-password"
        />
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="••••••••"
          autocomplete="new-password"
        />
        @if (passwordMismatch) {
          <span class="field-error">Passwords do not match</span>
        }
      </div>

      @if (error) {
        <div class="error-banner">{{ error }}</div>
      }

      <button type="submit" class="btn-submit" [disabled]="loading || form.invalid">
        @if (loading) { Creating account… } @else { Create account }
      </button>
    </form>

    <p class="auth-footer">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
